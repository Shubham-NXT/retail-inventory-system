# ==============================================================================
#   Database Configuration (Local & Cloud Deployment Compatible)
# ==============================================================================

# JDBC URL — uses SPRING_DATASOURCE_URL if set on cloud (Render/Aiven/TiDB),
# otherwise falls back to your local MySQL instance.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/retail_inventory_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

# MySQL credentials — overridden by cloud environment variables when deployed
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin@2026}

# JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
#   JPA / Hibernate Configuration
# ==============================================================================

# Automatically creates/updates tables based on entity definitions
spring.jpa.hibernate.ddl-auto=update

# Explicit dialect prevents dialect detection crashes during cloud startup
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL logging
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

spring.jpa.open-in-view=true

# ==============================================================================
#   Server Configuration
# ==============================================================================

# Cloud platforms like Render dynamically assign the listening port via $PORT
server.port=${PORT:8080}
