# ========================================
#   MySQL Database Configuration
# ========================================

# JDBC URL — connects to a MySQL database named 'student_db'
# Make sure you create this database in MySQL first:  CREATE DATABASE student_db;
spring.datasource.url=jdbc:mysql://localhost:3306/student_db

# MySQL login credentials (change these to match your local MySQL setup)
spring.datasource.username=root
spring.datasource.password=admin@2026

# JDBC driver class for MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
#   JPA / Hibernate Configuration
# ========================================

# 'update' means Hibernate will auto-create/update tables based on entity classes.
# Use 'create' to drop & recreate tables every restart (useful during early development).
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console (helpful for debugging)
spring.jpa.show-sql=true

# Use MySQL8's dialect so Hibernate generates optimised SQL for MySQL 8.x
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================================
#   Server Configuration
# ========================================

# The application will run on port 8080 (default). Change if needed.
server.port=8080
