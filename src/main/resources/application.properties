# ==============================================================================
#   MySQL Database Configuration (Retail Inventory Management System)
# ==============================================================================

# JDBC URL — connects to retail_inventory_db
# createDatabaseIfNotExist=true creates the database automatically
# allowPublicKeyRetrieval=true solves the MySQL 8 caching_sha2_password public key retrieval error
spring.datasource.url=jdbc:mysql://localhost:3306/retail_inventory_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# MySQL login credentials
spring.datasource.username=root
spring.datasource.password=admin@2026

# JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
#   JPA / Hibernate Configuration
# ==============================================================================

# Automatically creates/updates tables in MySQL based on Java @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Print SQL queries to the console for easy debugging & viva demonstration
spring.jpa.show-sql=true

# Hibernate 6 automatically detects MySQLDialect
spring.jpa.open-in-view=true

# ==============================================================================
#   Server Configuration
# ==============================================================================

server.port=8080
