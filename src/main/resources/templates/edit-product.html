<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product / Restock - Retail Inventory</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- ===== Navigation Bar ===== -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" th:href="@{/products}">
                🛒 Retail Inventory Management System
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" th:href="@{/products}">📋 Inventory Dashboard</a>
            </div>
        </div>
    </nav>

    <!-- ===== Form Container ===== -->
    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">

                <div class="card shadow border-0 rounded-3">
                    <div class="card-header bg-warning text-dark text-center py-3">
                        <h4 class="mb-0 fw-bold">✏️ Edit Product Details / Restock Stock</h4>
                    </div>
                    <div class="card-body p-4">

                        <!-- Red Bootstrap Alert for Validation Errors -->
                        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
                            <strong>⚠️ Validation Error:</strong>
                            <span th:text="${errorMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <!-- Current Product Status Banner -->
                        <div class="alert alert-secondary py-2 mb-4 d-flex justify-content-between align-items-center">
                            <span>Editing Product ID: <strong>#<span th:text="${product.id}"></span></strong></span>
                            <div>
                                <span th:if="${product.isLowStock()}" class="badge bg-danger fs-6">
                                    ⚠️ Low Stock Alert
                                </span>
                                <span th:if="${!product.isLowStock()}" class="badge bg-success fs-6">
                                    ✓ In Stock
                                </span>
                            </div>
                        </div>

                        <!-- Edit / Restock Form -->
                        <form th:action="@{/products/update/{id}(id=${product.id})}" th:object="${product}" method="post">

                            <!-- Hidden field to preserve ID -->
                            <input type="hidden" th:field="*{id}" />

                            <!-- Product Name (Inherited from BaseItem) -->
                            <div class="mb-3">
                                <label for="productName" class="form-label fw-semibold">Product Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control form-control-lg" id="productName"
                                       th:field="*{productName}" placeholder="Enter product name">
                            </div>

                            <div class="row">
                                <!-- SKU Code (Inherited from BaseItem) -->
                                <div class="col-md-6 mb-3">
                                    <label for="skuCode" class="form-label fw-semibold">SKU Code <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="skuCode"
                                       th:field="*{skuCode}" placeholder="Enter SKU">
                                </div>

                                <!-- Category (Inherited from BaseItem) -->
                                <div class="col-md-6 mb-3">
                                    <label for="category" class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="category"
                                       th:field="*{category}" placeholder="Enter category">
                                </div>
                            </div>

                            <div class="row">
                                <!-- Unit Price -->
                                <div class="col-md-4 mb-3">
                                    <label for="unitPrice" class="form-label fw-semibold">Unit Price (₹) <span class="text-danger">*</span></label>
                                    <input type="number" step="0.01" class="form-control" id="unitPrice"
                                           th:field="*{unitPrice}" placeholder="0.00">
                                </div>

                                <!-- Quantity / Restock -->
                                <div class="col-md-4 mb-3">
                                    <label for="quantity" class="form-label fw-semibold">Quantity In Stock <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="quantity"
                                           th:field="*{quantity}" placeholder="0">
                                    <small class="text-muted">Update to restock</small>
                                </div>

                                <!-- Reorder Level -->
                                <div class="col-md-4 mb-3">
                                    <label for="reorderLevel" class="form-label fw-semibold">Reorder Level <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="reorderLevel"
                                           th:field="*{reorderLevel}" placeholder="0">
                                    <small class="text-muted">Threshold for alert</small>
                                </div>
                            </div>

                            <!-- Buttons -->
                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn btn-warning btn-lg flex-grow-1 fw-bold text-dark">
                                    💾 Update Product / Restock
                                </button>
                                <a th:href="@{/products}" class="btn btn-outline-secondary btn-lg">
                                    Cancel
                                </a>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
