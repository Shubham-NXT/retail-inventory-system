<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student / Pay Fee - Student Management System</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- ===== Navigation Bar ===== -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/students}">📚 Student Management System</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" th:href="@{/students}">📋 View All Students</a>
            </div>
        </div>
    </nav>

    <!-- ===== Main Content ===== -->
    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-md-7">

                <!-- Card container for Edit / Update Form -->
                <div class="card shadow border-0 rounded-3">
                    <div class="card-header bg-warning text-dark text-center py-3">
                        <h4 class="mb-0 fw-bold">✏️ Edit Student / Update Fee</h4>
                    </div>
                    <div class="card-body p-4">

                        <!-- Red Bootstrap Alert for Validation Errors -->
                        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
                            <strong>⚠️ Validation Error:</strong>
                            <span th:text="${errorMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <!-- Info Banner showing current balance -->
                        <div class="alert alert-info py-2 mb-3 d-flex justify-content-between align-items-center">
                            <span>Editing Student <strong>#<span th:text="${student.id}"></span></strong></span>
                            <span class="badge bg-secondary fs-6">
                                Pending Balance: ₹<span th:text="${student.totalFee != null && student.paidFee != null ? (student.totalFee - student.paidFee) : 0.0}">0.0</span>
                            </span>
                        </div>

                        <!-- Edit Form -->
                        <form th:action="@{/students/update/{id}(id=${student.id})}" th:object="${student}" method="post">

                            <!-- Hidden field to keep ID intact -->
                            <input type="hidden" th:field="*{id}" />

                            <!-- Full Name -->
                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="name"
                                       th:field="*{name}" placeholder="Enter full name">
                            </div>

                            <!-- Email Address -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="email"
                                       th:field="*{email}" placeholder="Enter email">
                            </div>

                            <!-- Course -->
                            <div class="mb-3">
                                <label for="course" class="form-label fw-semibold">Course <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="course"
                                       th:field="*{course}" placeholder="Enter course">
                            </div>

                            <!-- Row for Fees -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="totalFee" class="form-label fw-semibold">Total Fee (₹) <span class="text-danger">*</span></label>
                                    <input type="number" step="0.01" class="form-control" id="totalFee"
                                           th:field="*{totalFee}" placeholder="0.00">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="paidFee" class="form-label fw-semibold">Paid Fee (₹) <span class="text-danger">*</span></label>
                                    <input type="number" step="0.01" class="form-control" id="paidFee"
                                           th:field="*{paidFee}" placeholder="0.00">
                                    <small class="text-muted">Increase this value when fee is paid.</small>
                                </div>
                            </div>

                            <!-- Form Actions -->
                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn btn-warning btn-lg flex-grow-1 fw-bold text-dark">
                                    💾 Save Changes / Update Fee
                                </button>
                                <a th:href="@{/students}" class="btn btn-outline-secondary btn-lg">
                                    Cancel
                                </a>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
