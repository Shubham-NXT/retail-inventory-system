<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Student Management System</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- ===== Navigation Bar ===== -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/students}">📚 Student Management System</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" th:href="@{/students}">🏠 Home</a>
            </div>
        </div>
    </nav>

    <!-- ===== Main Content ===== -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7">

                <!-- Error Card -->
                <div class="card shadow border-0 rounded-3 text-center">
                    <div class="card-header bg-danger text-white py-3">
                        <h4 class="mb-0">⚠️ Something Went Wrong</h4>
                    </div>
                    <div class="card-body p-5">

                        <!-- Icon -->
                        <div class="display-1 text-danger mb-3">
                            <span style="font-size: 4rem;">🚫</span>
                        </div>

                        <!-- Error Title -->
                        <h3 class="card-title text-dark fw-bold mb-3"
                            th:text="${errorTitle != null ? errorTitle : 'Application Error'}">
                            Student Not Found
                        </h3>

                        <!-- Error Message -->
                        <div class="alert alert-danger mx-auto text-start mb-4" style="max-width: 500px;">
                            <strong>Message: </strong>
                            <span th:text="${errorMessage != null ? errorMessage : 'The requested resource could not be found or processed.'}">
                                Error details here.
                            </span>
                        </div>

                        <!-- Timestamp if available -->
                        <p class="text-muted small mb-4" th:if="${timestamp}">
                            Occurred at: <span th:text="${timestamp}"></span>
                        </p>

                        <!-- Back to Home Button -->
                        <div>
                            <a th:href="@{/students}" class="btn btn-primary btn-lg px-4 shadow-sm">
                                🏠 Back to Student List
                            </a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
